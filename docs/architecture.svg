<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Inter, 'Segoe UI', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fd7af"/>
    </marker>
    <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#af87ff"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/><stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="48" y="62" fill="#e6edf3" font-size="30" font-weight="700">◆ Fawwk</text>
  <text x="196" y="62" fill="#8b96a5" font-size="18">how a push becomes a live app, on your own server</text>

  <!-- Outside the server -->
  <g>
    <rect x="48" y="196" width="170" height="74" rx="14" fill="#161e29" stroke="#2c3747"/>
    <text x="133" y="230" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600">Browser</text>
    <text x="133" y="253" text-anchor="middle" fill="#8b96a5" font-size="13">your visitors</text>

    <rect x="48" y="492" width="170" height="74" rx="14" fill="#161e29" stroke="#2c3747"/>
    <text x="133" y="526" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600">GitHub push</text>
    <text x="133" y="549" text-anchor="middle" fill="#8b96a5" font-size="13">signed webhook</text>
  </g>

  <!-- Server frame -->
  <rect x="270" y="104" width="962" height="556" rx="22" fill="#0f151d" stroke="#2f3a4b" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="296" y="90" width="214" height="28" rx="14" fill="#0f151d" stroke="#2f3a4b"/>
  <text x="403" y="109" text-anchor="middle" fill="#8b96a5" font-size="14" font-weight="600">your Ubuntu server</text>

  <!-- Caddy -->
  <rect x="310" y="160" width="270" height="150" rx="16" fill="#132a26" stroke="#5fd7af" stroke-width="1.6"/>
  <text x="332" y="194" fill="#5fd7af" font-size="13" font-weight="700" letter-spacing="1.2">PROXY</text>
  <text x="332" y="222" fill="#e6edf3" font-size="20" font-weight="700">Caddy</text>
  <text x="332" y="248" fill="#9fb1c2" font-size="13.5">fawwk-proxy · :80 / :443</text>
  <text x="332" y="270" fill="#9fb1c2" font-size="13.5">automatic HTTPS certificates,</text>
  <text x="332" y="290" fill="#9fb1c2" font-size="13.5">routes by domain &amp; path</text>

  <!-- Apps -->
  <rect x="660" y="140" width="290" height="80" rx="14" fill="#161e29" stroke="#3b4a5e"/>
  <text x="682" y="172" fill="#e6edf3" font-size="17" font-weight="700">fawwk-web-…</text>
  <text x="682" y="198" fill="#af87ff" font-size="14">example.com</text>

  <rect x="660" y="246" width="290" height="80" rx="14" fill="#161e29" stroke="#3b4a5e"/>
  <text x="682" y="278" fill="#e6edf3" font-size="17" font-weight="700">fawwk-api-…</text>
  <text x="682" y="304" fill="#af87ff" font-size="14">api.example.com · example.com/api</text>

  <text x="805" y="128" text-anchor="middle" fill="#8b96a5" font-size="12.5" letter-spacing="1.2">APP CONTAINERS</text>

  <!-- Database -->
  <rect x="660" y="368" width="290" height="96" rx="14" fill="#1d1833" stroke="#af87ff" stroke-width="1.6"/>
  <text x="682" y="400" fill="#af87ff" font-size="13" font-weight="700" letter-spacing="1.2">DATABASE</text>
  <text x="682" y="426" fill="#e6edf3" font-size="17" font-weight="700">fawwk-db-shop</text>
  <text x="682" y="450" fill="#9fb1c2" font-size="13.5">Postgres · Redis · MongoDB</text>
  <text x="975" y="412" fill="#8b96a5" font-size="13">private to your apps</text>
  <text x="975" y="432" fill="#8b96a5" font-size="13">backed up nightly</text>

  <!-- Arrows: browser → caddy → apps → db -->
  <line x1="218" y1="233" x2="304" y2="233" stroke="#5fd7af" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M580,214 C620,214 620,180 654,180" fill="none" stroke="#5fd7af" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M580,252 C620,252 620,286 654,286" fill="none" stroke="#5fd7af" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="805" y1="326" x2="805" y2="362" stroke="#af87ff" stroke-width="2.2" marker-end="url(#arrowv)"/>

  <!-- Deploy lane -->
  <rect x="310" y="492" width="250" height="74" rx="14" fill="#161e29" stroke="#3b4a5e"/>
  <text x="332" y="524" fill="#e6edf3" font-size="17" font-weight="700">fawwk-hooks</text>
  <text x="332" y="548" fill="#9fb1c2" font-size="13.5">panel.&lt;domain&gt;/hooks/github</text>
  <line x1="218" y1="529" x2="304" y2="529" stroke="#af87ff" stroke-width="2.2" marker-end="url(#arrowv)"/>

  <g font-size="14.5" font-weight="600">
    <rect x="600" y="507" width="92" height="44" rx="22" fill="#132a26" stroke="#5fd7af"/>
    <text x="646" y="534" text-anchor="middle" fill="#e6edf3">build</text>
    <rect x="720" y="507" width="160" height="44" rx="22" fill="#132a26" stroke="#5fd7af"/>
    <text x="800" y="534" text-anchor="middle" fill="#e6edf3">release command</text>
    <rect x="908" y="507" width="134" height="44" rx="22" fill="#132a26" stroke="#5fd7af"/>
    <text x="975" y="534" text-anchor="middle" fill="#e6edf3">health check</text>
    <rect x="1070" y="507" width="92" height="44" rx="22" fill="#5fd7af" filter="url(#glow)"/>
    <text x="1116" y="534" text-anchor="middle" fill="#0d1219" font-weight="800">swap</text>
  </g>
  <g stroke="#5fd7af" stroke-width="2" marker-end="url(#arrow)">
    <line x1="560" y1="529" x2="596" y2="529"/>
    <line x1="692" y1="529" x2="716" y2="529"/>
    <line x1="880" y1="529" x2="904" y2="529"/>
    <line x1="1042" y1="529" x2="1066" y2="529"/>
  </g>
  <!-- swap → app containers -->
  <path d="M1162,529 C1206,529 1206,170 956,180" fill="none" stroke="#5fd7af" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="975" y="262" fill="#8b96a5" font-size="12.5">zero downtime: the old</text>
  <text x="975" y="280" fill="#8b96a5" font-size="12.5">version stays live until</text>
  <text x="975" y="298" fill="#8b96a5" font-size="12.5">the new one answers</text>

  <!-- Timer -->
  <text x="310" y="616" fill="#8b96a5" font-size="13.5">⏱  fawwk-autodeploy.timer: every minute, new commit? (other git hosts, and a backup for webhooks)</text>
  <text x="310" y="640" fill="#5b6675" font-size="12.5">✓ / ✗ on each GitHub commit · Telegram, Slack or Discord when a deploy fails</text>
</svg>
